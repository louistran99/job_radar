<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAN-28 · Mock Set B · Bottom sheet + dense feed</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ----- Set B specific ----- */
  .topbar { padding: 8px 16px 6px; flex: none; }
  .topbar h1 { font-size: 22px; font-weight: 700; }
  .topbar .sub { color: var(--muted); font-size: 13px; }

  .chips { display: flex; gap: 8px; padding: 4px 16px 8px; flex: none; }
  .chip { flex: 1; min-width: 0; height: 44px; border-radius: 10px; background: #f0f2f6; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 6px; }
  .chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .n { background: var(--accent); color: #fff; font-size: 11px; min-width: 18px; height: 18px;
    border-radius: 9px; display: inline-grid; place-items: center; padding: 0 5px; margin-left: 6px; }
  .chip.has { background: var(--accent-bg); color: var(--accent); }

  .feed { flex: 1; min-height: 0; }
  .group { position: sticky; top: 0; z-index: 1; padding: 6px 16px; font-size: 12px; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted); background: #f3f4f7; border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line); }

  /* Same pills + inline "Clear all" as Sets A/C, but capped at two rows plus a peek of the third
     (the peek signals it scrolls). Shared .pillwrap has 2px/8px vertical padding: 92 + 10 = 102. */
  .pillwrap { max-height: 102px; }
  .pillwrap .pill .x::after { inset: -6px; } /* 44px hit area without overlapping the row below */

  .row { display: block; width: 100%; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .row:hover { background: #fafbfc; }
  .row h3 { font-size: 16px; font-weight: 650; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .row .line { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; }
  .row .salary { font-weight: 700; }
  .row .salary.none { font-weight: 500; color: var(--muted); }
  .row .dot, .row .posted { color: var(--muted); font-size: 13px; }
  /* Muted, one line: host always shown, path truncates. The whole row is the tap target. */
  .row .url { margin-top: 4px; color: var(--muted); font-size: 12px; font-weight: 500; display: flex; gap: 6px; min-width: 0; }
  .row .url .u { display: flex; flex: 1; min-width: 0; white-space: nowrap; }
  .row .url .u-host { flex: 0 1 auto; min-width: 0; max-width: 70%; overflow: hidden; text-overflow: ellipsis; }
  .row .url .u-path { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .skrow { padding: 14px 16px; border-bottom: 1px solid var(--line); }

  /* Category sheet (phone: bottom sheet, web: centered dialog) */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%; background: var(--surface); z-index: 10;
    border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .sheet.enter { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(60px); opacity: 0; } }
  .browser .sheet { left: calc(50% - 215px); width: 430px; right: auto; bottom: auto; top: 90px; max-height: 70%;
    border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(20,24,31,.25); }
  .browser .sheet.enter { animation: fade .15s; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: #c5cad3; margin: 8px auto 0; flex: none; }
  .browser .grab { display: none; }
  .sheet header { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px 0 20px; flex: none; }
  .sheet header h2 { font-size: 18px; }
  .sheet header .close { width: var(--tap); height: var(--tap); display: grid; place-items: center; font-size: 26px; color: var(--muted); }
  .search { margin: 2px 16px 8px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); padding: 0 12px;
    font: inherit; width: calc(100% - 32px); background: #fafbfc; }
  .search:focus { outline: none; border-color: var(--accent); background: #fff; }
  .sheet .opts { flex: 1; min-height: 0; padding: 0 20px; }
  .opt { display: flex; align-items: center; gap: 14px; min-height: 50px; font-size: 16px; width: 100%;
    border-bottom: 1px solid var(--line); }
  .opt:last-child { border-bottom: 0; }
  .none-found { padding: 24px 0; text-align: center; color: var(--muted); }
  .sheet footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 18px;
    border-top: 1px solid var(--line); flex: none; }
  .sheet footer .btn.primary { flex: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="mocks.js"></script>
<script>
  const skeleton = `<div class="skrow"><div class="sk" style="height:16px;width:80%"></div>
    <div class="sk" style="height:12px;width:50%;margin-top:8px"></div>
    <div class="sk" style="height:14px;width:65%;margin-top:10px"></div>
    <div class="sk" style="height:11px;width:55%;margin-top:8px"></div></div>`;

  const row = (j, ui) => `
    <button class="row" data-act="openlink" data-val="${ui.esc(ui.host(j))}" aria-label="Open listing: ${ui.esc(j.title)}">
      <h3>${ui.esc(j.title)}</h3>
      <p class="meta">${ui.esc(j.company)} · ${ui.esc(j.location)}</p>
      <div class="line">
        <span class="salary ${j.salary ? "" : "none"}">${j.salary || "Salary not listed"}</span>
        <span class="dot">·</span><span class="posted">${ui.posted(j)}</span>
      </div>
      <div class="url"><span class="u"><span class="u-host">${ui.esc(ui.host(j))}</span><span class="u-path">${ui.esc(ui.url(j).slice(ui.host(j).length))}</span></span><span aria-hidden="true">↗</span></div>
    </button>`;

  // Newest first, with a sticky header each time the freshness bucket changes.
  function feed(jobs, ui) {
    let last = "", out = "";
    for (const j of jobs) {
      const g = ui.group(j);
      if (g !== last) { out += `<div class="group">${g}</div>`; last = g; }
      out += row(j, ui);
    }
    return out;
  }

  KAN28.start({
    id: "b",
    title: "Mock Set B — Category bottom sheet + dense feed",
    intro: "Three category chips. Tapping one opens a focused sheet with a searchable multi-select list. Apply sends one request. Results are a compact feed grouped by freshness (Today / Yesterday / This week / Earlier), newest first. Pills wrap into at most two rows, then scroll vertically.",
    tradeoffs: [
      "<b>Strength:</b> the sheet scales to the hundreds of values the future API will return (search + big tap rows); dense rows fit 4–5 listings per phone screen; freshness groups make “what's new” obvious.",
      "<b>Cost:</b> a modal step for each category; you can't compare categories at a glance without the pills; pills beyond two rows are hidden until you scroll the pill area.",
      "<b>One layout:</b> on web the sheet becomes a centered 430px dialog with the same content and footer.",
    ],
    tryIt: [
      "Tap <b>Location</b>, type “us” in search, pick options, then <b>Apply</b>. Search is in every sheet.",
      "Tap <b>Reset</b> in the sheet to clear the picks in that category before applying. The × or <b>Esc</b> closes without changes.",
      "Pick enough values to overflow two rows, then scroll the pill area up and down. <b>Clear all</b> is the last item, after the final pill.",
      "Remove a pill with its <b>×</b>; <b>Clear all</b> removes everything.",
      "Use <b>Force state</b> → Error to see the error state with <b>Try again</b>.",
      "Tap any row to see the open-listing action. Switch to <b>Web</b> to see the dialog.",
    ],
    render(S, ui) {
      const st = ui.status(), jobs = ui.jobs();
      const chips = ui.cats.map((cat) => {
        const n = S.sel[cat].length;
        return `<button class="chip ${n ? "has" : ""}" data-act="open" data-cat="${cat}" aria-haspopup="dialog"><span class="t">${cat}${n ? `<span class="n">${n}</span>` : ""}</span><span class="chev"></span></button>`;
      }).join("");

      let sheet = "";
      if (S.open) {
        const all = ui.FILTERS[S.open];
        const q = S.query.trim().toLowerCase();
        const shown = all.filter((o) => o.toLowerCase().includes(q));
        const opts = shown.map((o) => {
          const on = S.draft.includes(o);
          return `<button class="opt" role="checkbox" aria-checked="${on}" data-act="toggle" data-val="${ui.esc(o)}"><span class="check ${on ? "on" : ""}"></span>${o}</button>`;
        }).join("") || `<p class="none-found">No “${ui.esc(S.query)}” in ${S.open}</p>`;
        const n = S.draft.length;
        sheet = `<div class="scrim" data-act="scrim"></div>
          <div class="sheet ${S.enter ? "enter" : ""}" role="dialog" aria-modal="true" aria-label="${S.open} filter">
            <div class="grab"></div>
            <header><h2>${S.open}</h2><button class="close" data-act="cancel" aria-label="Close">×</button></header>
            <input class="search" data-act="query" type="search" placeholder="Search ${S.open.toLowerCase()}" value="${ui.esc(S.query)}" aria-label="Search ${S.open}">
            <div class="opts" data-scroll="sheet">${opts}</div>
            <footer><button class="btn ghost muted" data-act="clearDraft">Reset</button>
              <button class="btn primary" data-act="done">Apply${n ? ` (${n})` : ""}</button></footer></div>`;
      }

      let body;
      if (st === "loading") {
        body = `<div class="progress"></div><div class="feed" data-scroll="list">${skeleton.repeat(6)}</div>`;
      } else if (st === "error") {
        body = `<div class="feed" data-scroll="list">${ui.errorBlock()}</div>`;
      } else if (!jobs.length) {
        body = `<div class="feed" data-scroll="list">${ui.emptyBlock()}</div>`;
      } else {
        body = `<div class="feed" data-scroll="list">${feed(jobs, ui)}</div>`;
      }

      return `<div class="topbar"><h1>Jobs</h1><div class="sub">${ui.sub()}</div></div>
        <div class="chips">${chips}</div>${ui.pills()}${body}${sheet}`;
    },
  });
</script>
</body>
</html>
