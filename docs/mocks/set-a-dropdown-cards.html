<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAN-28 · Mock Set A · Dropdown filters + cards</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ----- Set A specific ----- */
  .filters-wrap { position: relative; z-index: 6; background: var(--surface); flex: none; }
  .filters { display: flex; gap: 8px; padding: 4px 16px 10px; }
  .fbtn {
    flex: 1; min-width: 0; height: var(--tap); border-radius: 24px; border: 1.5px solid var(--line);
    background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .fbtn .n { background: var(--accent); color: #fff; font-size: 11px; min-width: 18px; height: 18px;
    border-radius: 9px; display: grid; place-items: center; padding: 0 5px; }
  .fbtn.has { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  .fbtn.open { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  .dd { position: absolute; top: calc(100% - 4px); left: 12px; right: 12px; background: var(--surface);
    border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 12px 28px rgba(20,24,31,.22); animation: drop .14s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
  .browser .dd { right: auto; width: 270px; left: min(calc(16px + var(--i) * 205px), calc(100% - 286px)); }
  .dd .opts { max-height: 312px; }
  .opt { display: flex; align-items: center; gap: 14px; min-height: var(--tap); padding: 0 16px; font-size: 15px;
    border-bottom: 1px solid var(--line); width: 100%; }
  .opt:hover { background: #f6f7f9; }
  .dd footer { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px;
    border-top: 1px solid var(--line); background: #fafbfc; }
  .dd footer .btn { height: 44px; }

  .resultbar { display: flex; justify-content: space-between; padding: 6px 16px; font-size: 13px; color: var(--muted);
    border-top: 1px solid var(--line); flex: none; }
  .list { flex: 1; background: #f6f7f9; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .list.plain { background: var(--surface); }

  .job { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); padding: 14px; flex: none; }
  .job h3 { font-size: 16px; line-height: 1.25; font-weight: 700;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .job .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .job .line { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; }
  .job .salary { font-weight: 700; }
  .job .salary.none { font-weight: 500; color: var(--muted); }
  .job .posted { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .job .url { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 4px;
    border-top: 1px solid var(--line); color: var(--accent); font-size: 13px; font-weight: 600; min-height: 44px;
    align-items: center; width: 100%; padding-top: 0; }
  .job .url span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skel-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); padding: 14px; flex: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="mocks.js"></script>
<script>
  const skeleton = `<div class="skel-card">
    <div class="sk" style="height:16px;width:85%"></div><div class="sk" style="height:16px;width:55%;margin-top:6px"></div>
    <div class="sk" style="height:12px;width:45%;margin-top:12px"></div>
    <div class="sk" style="height:14px;width:70%;margin-top:14px"></div>
    <div class="sk" style="height:12px;width:60%;margin-top:18px"></div></div>`;

  const card = (j, ui) => `
    <article class="job">
      <h3>${ui.esc(j.title)}</h3>
      <p class="meta">${ui.esc(j.company)} · ${ui.esc(j.location)}</p>
      <div class="line">
        <span class="salary ${j.salary ? "" : "none"}">${j.salary || "Salary not listed"}</span>
        <span class="posted">${ui.isNew(j) ? ui.newTag : ""}${ui.posted(j)}</span>
      </div>
      <button class="url" data-act="openlink" data-val="${ui.esc(ui.host(j))}" aria-label="Open listing for ${ui.esc(j.title)}">
        <span>${ui.esc(ui.url(j))}</span><span aria-hidden="true">↗</span></button>
    </article>`;

  KAN28.start({
    id: "a",
    title: "Mock Set A — Dropdown filters + cards",
    intro: "Literal reading of the ticket: three category buttons in one row; tapping one opens a multi-select dropdown. Picks become removable pills below the row. Results are freshness-sorted cards.",
    tradeoffs: [
      "<b>Strength:</b> matches the ticket exactly; every category is one tap away; cards are self-contained and easy to scan.",
      "<b>Cost:</b> cards are tall (about 3 per phone screen); the dropdown covers part of the list while open; long option lists scroll inside the dropdown.",
      "<b>One layout:</b> on web the same screen sits in a 640px column and the dropdown becomes a popover anchored under its button.",
    ],
    tryIt: [
      "Tap <b>Domain</b>, pick a few options, then <b>Done</b>. One request is sent when you tap Done (or the dimmed area).",
      "Tap the <b>×</b> on a pill to deselect it. Tap <b>Clear all</b> to reset.",
      "Pick <b>Head of Engineering</b> + <b>Android</b> to reach the no-results state.",
      "Check <b>Next request fails</b>, change a filter, then tap <b>Try again</b>.",
      "Tap a card's link row to see the open-listing action. Switch to <b>Web</b> to compare.",
    ],
    scrimApplies: true,
    render(S, ui) {
      const st = ui.status(), jobs = ui.jobs();
      const btns = ui.cats.map((cat) => {
        const open = S.open === cat;
        const n = open ? S.draft.length : S.sel[cat].length;
        return `<button class="fbtn ${n ? "has" : ""} ${open ? "open" : ""}" data-act="open" data-cat="${cat}" aria-haspopup="listbox" aria-expanded="${open}">${cat}${n ? `<span class="n">${n}</span>` : ""}<span class="chev ${open ? "up" : ""}"></span></button>`;
      }).join("");

      let dd = "";
      if (S.open) {
        const i = ui.cats.indexOf(S.open);
        const opts = ui.FILTERS[S.open].map((o) => {
          const on = S.draft.includes(o);
          return `<button class="opt" role="option" aria-selected="${on}" data-act="toggle" data-val="${ui.esc(o)}"><span class="check ${on ? "on" : ""}"></span>${o}</button>`;
        }).join("");
        dd = `<div class="dd" style="--i:${i}" role="listbox" aria-multiselectable="true" aria-label="${S.open}">
          <div class="opts" data-scroll="dd">${opts}</div>
          <footer><button class="btn ghost muted" data-act="clearDraft">Clear</button><button class="btn primary" data-act="done">Done</button></footer></div>`;
      }

      let body;
      if (st === "loading") {
        body = `<div class="progress"></div><div class="resultbar"><span>Searching…</span></div><div class="list" data-scroll="list">${skeleton.repeat(3)}</div>`;
      } else if (st === "error") {
        body = `<div class="list plain" data-scroll="list">${ui.errorBlock()}</div>`;
      } else if (!jobs.length) {
        body = `<div class="resultbar"><span>0 results</span></div><div class="list plain" data-scroll="list">${ui.emptyBlock()}</div>`;
      } else {
        body = `<div class="resultbar"><span>${jobs.length} results</span><span>Newest first</span></div>
          <div class="list" data-scroll="list">${jobs.map((j) => card(j, ui)).join("")}</div>`;
      }

      return `<div class="appbar"><h1>Jobs</h1><div class="sub">${ui.sub()}</div></div>
        <div class="filters-wrap"><div class="filters">${btns}</div>${dd}</div>
        ${ui.pills()}${body}
        ${S.open ? '<div class="scrim" data-act="scrim"></div>' : ""}`;
    },
  });
</script>
</body>
</html>
