<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAN-28 · Mock Set C · Inline panel + compact rows</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ----- Set C specific ----- */
  .tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; padding: 0 8px; }
  .tab { flex: 1; min-width: 0; height: var(--tap); display: flex; align-items: center; justify-content: center; gap: 6px;
    font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tab .n { background: var(--accent); color: #fff; font-size: 11px; min-width: 18px; height: 18px;
    border-radius: 9px; display: grid; place-items: center; padding: 0 5px; }
  .tab.has { color: var(--ink); }
  .tab.open { color: var(--accent); border-bottom-color: var(--accent); }

  /* Inline panel pushes content down instead of covering it. Picks apply live (debounced). */
  .panel { flex: none; background: #f6f7f9; border-bottom: 1px solid var(--line); padding: 12px 16px 6px; animation: expand .16s ease-out; }
  @keyframes expand { from { opacity: 0; transform: translateY(-6px); } }
  .panel .grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 176px; padding-bottom: 6px; }
  .opt { height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--surface);
    font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; position: relative; }
  .opt::after { content: ""; position: absolute; inset: -4px 0; } /* 48px hit area */
  .opt.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.on::before { content: "\2713"; font-size: 13px; }
  .panel .bar { display: flex; justify-content: space-between; align-items: center; }
  .panel .bar .btn { height: 44px; }
  .panel .hint { font-size: 12px; color: var(--muted); }

  .pillwrap { padding-top: 8px; }
  .list { flex: 1; min-height: 0; }
  .crow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .crow h3 { font-size: 16px; font-weight: 700; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .crow .meta { color: var(--muted); font-size: 13px; }
  .crow .salary { font-weight: 700; font-size: 14px; margin-top: 4px; }
  .crow .salary.none { font-weight: 500; color: var(--muted); }
  .crow .side { grid-row: 1 / span 3; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .crow .when { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .crow .go { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-bg); color: var(--accent);
    display: grid; place-items: center; font-size: 18px; font-weight: 700; margin-top: auto; }
  .crow .link { grid-column: 1; color: var(--accent); font-size: 12px; font-weight: 600; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skrow { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sub b { color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>
<script src="mocks.js"></script>
<script>
  const skeleton = `<div class="skrow"><div class="sk" style="height:16px;width:78%"></div>
    <div class="sk" style="height:12px;width:48%;margin-top:8px"></div>
    <div class="sk" style="height:14px;width:36%;margin-top:10px"></div></div>`;

  const crow = (j, ui) => `
    <article class="crow">
      <h3>${ui.esc(j.title)}</h3>
      <p class="meta">${ui.esc(j.company)} · ${ui.esc(j.location)}</p>
      <p class="salary ${j.salary ? "" : "none"}">${j.salary || "Salary not listed"}</p>
      <div class="side">${ui.isNew(j) ? ui.newTag : ""}<span class="when">${ui.posted(j)}</span>
        <button class="go" data-act="openlink" data-val="${ui.esc(ui.host(j))}" aria-label="Open listing: ${ui.esc(j.title)}">↗</button></div>
      <p class="link">${ui.esc(ui.url(j))}</p>
    </article>`;

  KAN28.start({
    id: "c",
    live: true, // picks apply immediately (debounced) instead of on Done
    title: "Mock Set C — Inline panel + compact rows",
    intro: "Three tabs. Tapping one expands an inline panel of toggle chips that pushes the list down (nothing is covered). Picks apply live with a short debounce, so there is no Apply step. Rows are compact with a dedicated open button.",
    tradeoffs: [
      "<b>Strength:</b> fastest to use: no modal, no Done button, results update as you pick; the list stays visible so you see the effect immediately.",
      "<b>Cost:</b> more API calls (debounced); the open panel eats vertical space on small phones; chips get unwieldy once the API returns hundreds of values per category.",
      "<b>One layout:</b> web is the same 640px column; the panel simply has more horizontal room, so chips wrap into fewer rows.",
    ],
    tryIt: [
      "Tap <b>Domain</b> and toggle chips; the list refreshes about half a second after you stop tapping.",
      "Tap the active tab again, or <b>Done</b>, to collapse the panel.",
      "Remove a pill with its <b>×</b>; <b>Clear all</b> resets everything.",
      "Pick <b>Head of Engineering</b> + <b>Android</b> for the no-results state, then <b>Clear all filters</b>.",
      "Check <b>Next request fails</b>, then change a chip to see the error state and Try again.",
    ],
    render(S, ui) {
      const st = ui.status(), jobs = ui.jobs();
      const tabs = ui.cats.map((cat) => {
        const open = S.open === cat, n = S.sel[cat].length;
        return `<button class="tab ${n ? "has" : ""} ${open ? "open" : ""}" data-act="open" data-cat="${cat}" aria-expanded="${open}">${cat}${n ? `<span class="n">${n}</span>` : ""}<span class="chev ${open ? "up" : ""}"></span></button>`;
      }).join("");

      let panel = "";
      if (S.open) {
        const chips = ui.FILTERS[S.open].map((o) => {
          const on = S.sel[S.open].includes(o);
          return `<button class="opt ${on ? "on" : ""}" role="checkbox" aria-checked="${on}" data-act="toggle" data-val="${ui.esc(o)}">${o}</button>`;
        }).join("");
        panel = `<div class="panel" role="group" aria-label="${S.open} options">
          <div class="grid" data-scroll="panel">${chips}</div>
          <div class="bar"><button class="btn ghost muted" data-act="clearDraft">Clear ${S.open.toLowerCase()}</button>
            <button class="btn ghost" data-act="cancel">Done</button></div></div>`;
      }

      let body;
      if (st === "loading") {
        body = `<div class="progress"></div><div class="list" data-scroll="list">${skeleton.repeat(6)}</div>`;
      } else if (st === "error") {
        body = `<div class="list" data-scroll="list">${ui.errorBlock()}</div>`;
      } else if (!jobs.length) {
        body = `<div class="list" data-scroll="list">${ui.emptyBlock()}</div>`;
      } else {
        body = `<div class="list" data-scroll="list">${jobs.map((j) => crow(j, ui)).join("")}</div>`;
      }

      return `<div class="appbar"><h1>Jobs</h1><div class="sub">${ui.sub()}</div></div>
        <div class="tabs" role="tablist">${tabs}</div>${panel}${ui.pills()}${body}`;
    },
  });
</script>
</body>
</html>
