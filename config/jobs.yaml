# Daily ATS job monitor — append companies, title_match phrases, and locations here.
# Public Greenhouse / Lever / Ashby / Gem boards; no API keys.
# Copy-on-first-run: config/jobs.local.yaml (gitignored) is what local runs use.

settings:
  delay_seconds: 0.35

sources:
  greenhouse:
    enabled: true
    url: "https://boards-api.greenhouse.io/v1/boards/{slug}/jobs"
  lever:
    enabled: true
    url: "https://api.lever.co/v0/postings/{slug}?mode=json"
  ashby:
    enabled: true
    url: "https://api.ashbyhq.com/posting-api/job-board/{slug}"
  gem:
    enabled: true
    url: "https://api.gem.com/job_board/v0/{slug}/job_posts/"
  # TBD — same URL pattern as https://conorscode.github.io/ats-api-reference/
  # workday:
  #   enabled: false
  #   # POST, not GET. Needs tenant + shard + site from a real careers URL;
  #   # the slug is not guessable from the company name.
  #   url: "https://{tenant}.{shard}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs"
  # smartrecruiters:
  #   enabled: false
  #   url: "https://api.smartrecruiters.com/v1/companies/{slug}/postings"
  # workable:
  #   enabled: false
  #   url: "https://apply.workable.com/api/v1/widget/accounts/{slug}"

# Title must hit at least one level phrase AND at least one domain phrase.
title_match:
  level:
    - manager
    - head of
    - director
  domain:
